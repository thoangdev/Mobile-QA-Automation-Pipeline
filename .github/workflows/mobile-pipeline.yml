name: Mobile QA Pipeline

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '0 2 * * *' # nightly regression at 02:00 UTC

# Shared env — steps reference env.* so optional jobs skip cleanly when a
# secret isn't configured yet.
env:
  TEST_ENV: staging
  TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
  TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
  BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
  BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
  BS_ANDROID_APP_HASH: ${{ secrets.BS_ANDROID_APP_HASH }}
  BS_IOS_APP_HASH: ${{ secrets.BS_IOS_APP_HASH }}
  MOBSF_URL: ${{ secrets.MOBSF_URL }}
  MOBSF_API_KEY: ${{ secrets.MOBSF_API_KEY }}
  PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
  SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
  DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

jobs:
  # ── Gate: typecheck + lint ─────────────────────────────────────────────────
  lint:
    name: Typecheck & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

  # ── Security scan ──────────────────────────────────────────────────────────
  security:
    name: MobSF Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint
    if: ${{ vars.MOBSF_URL != '' && vars.MOBSF_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run scan:mobsf

  # ── API validation ─────────────────────────────────────────────────────────
  api:
    name: API Tests (Newman)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run test:api

  # ── Android smoke ──────────────────────────────────────────────────────────
  smoke-android:
    name: Smoke Tests — Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint, api]
    if: ${{ vars.BROWSERSTACK_USERNAME != '' && vars.BROWSERSTACK_ACCESS_KEY != '' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run test:smoke
      - name: Upload Android smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-android-${{ github.run_number }}
          path: reports/appium/
          retention-days: 30

  # ── iOS smoke (nightly + main only) ───────────────────────────────────────
  smoke-ios:
    name: Smoke Tests — iOS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint, api]
    if: |
      (github.event_name == 'schedule' || github.ref == 'refs/heads/main') &&
      vars.BROWSERSTACK_USERNAME != '' && vars.BROWSERSTACK_ACCESS_KEY != ''
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run test:smoke:ios
      - name: Upload iOS smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-ios-${{ github.run_number }}
          path: reports/appium/
          retention-days: 30

  # ── Android regression + Percy visual (nightly + main only) ───────────────
  regression-android:
    name: Regression + Visual — Android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: smoke-android
    if: |
      github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run test:visual
      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-android-${{ github.run_number }}
          path: reports/
          retention-days: 30

  # ── iOS regression (nightly + main only) ──────────────────────────────────
  regression-ios:
    name: Regression — iOS
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: smoke-ios
    if: |
      github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run test:regression:ios
      - name: Upload iOS regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-ios-${{ github.run_number }}
          path: reports/appium/
          retention-days: 30

  # ── Accessibility ──────────────────────────────────────────────────────────
  accessibility:
    name: Accessibility (Axe)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run test:a11y

  # ── Notifications ──────────────────────────────────────────────────────────
  notify:
    name: Notify Team
    runs-on: ubuntu-latest
    needs: [smoke-android, api, accessibility]
    if: always()
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Notify Slack
        if: ${{ env.SLACK_WEBHOOK != '' }}
        run: npm run notify:slack
      - name: Notify Discord
        if: ${{ env.DISCORD_WEBHOOK != '' }}
        run: npm run notify:discord
